<div class="confirm-dialog">
  <div class="confirm-dialog__icono" [class.peligro]="data.peligro">
    <mat-icon>{{ data.peligro ? 'delete_forever' : 'help_outline' }}</mat-icon>
  </div>
  <h2 mat-dialog-title>{{ data.titulo }}</h2>
  <mat-dialog-content>
    <p>{{ data.mensaje }}</p>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancelar()">
      {{ data.textoCancelar || 'Cancelar' }}
    </button>
    <button
      mat-flat-button
      type="button"
      [color]="data.peligro ? 'warn' : 'primary'"
      (click)="confirmar()"
    >
      {{ data.textoConfirmar || 'Confirmar' }}
    </button>
  </mat-dialog-actions>
</div>
